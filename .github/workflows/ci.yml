name: CI Release Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality-gate:
    name: Lint, Typecheck, Format, Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes -d hermes_staging"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hermes:hermes@localhost:5432/hermes_staging
      HERMES_ALLOW_DATABASE_RESET: "1"
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: hermes
      S3_SECRET_KEY: hermes-staging
      S3_BUCKET: hermes-artifacts
      TOKEN_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      INTERNAL_API_KEY: test-internal-api-key
      DISCORD_BOT_TOKEN: test-discord-token
      DISCORD_APP_ID: test-app-id
      DISCORD_PUBLIC_KEY: test-public-key
      OPENAI_API_KEY: test-openai-key

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @hermes/db exec prisma generate

      - name: Enable pgvector
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Push database schema
        run: pnpm --filter @hermes/db exec prisma db push --accept-data-loss

      - name: Apply database integrity constraints
        run: psql "$DATABASE_URL" -f packages/db/prisma/integrity-constraints.sql

      - name: Start MinIO
        run: |
          docker run --detach --name hermes-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=hermes \
            --env MINIO_ROOT_PASSWORD=hermes-staging \
            minio/minio:latest server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs hermes-minio
          exit 1

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Security regression suite
        run: pnpm vitest run test/security/

  docker-build:
    name: Docker Build (API)
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP=api
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
            SCHEMA_VERSION=20260819120000_document_extraction_support
          push: false
          tags: hermes-api:latest

      - name: Build Discord image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP=discord
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
            SCHEMA_VERSION=20260819120000_document_extraction_support
          push: false
          tags: hermes-discord:latest

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP=worker
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
            SCHEMA_VERSION=20260819120000_document_extraction_support
          push: false
          tags: hermes-worker:latest
